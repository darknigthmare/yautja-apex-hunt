name: Apex Hunt Alien_base reference bridge
on:
  push:
    paths:
      - 'src/data/AlienBaseRegistry.js'
      - 'src/data/alien-base-public-v1.js'
      - 'src/data/MediaCoverageCatalog.js'
      - 'tests/alien-base-reference.test.js'
      - '.github/workflows/alien-base-bridge.yml'
  pull_request:
    paths:
      - 'src/data/AlienBaseRegistry.js'
      - 'src/data/alien-base-public-v1.js'
      - 'src/data/MediaCoverageCatalog.js'
      - 'tests/alien-base-reference.test.js'
      - '.github/workflows/alien-base-bridge.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/alien-base-reference.test.js
